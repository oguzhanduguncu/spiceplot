[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "spiceplot"
version = "0.1.0"
description = "ngspice devrelerini arka planda çalıştırıp sonuçlarını numpy / matplotlib ile kullanma"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy", "matplotlib"]

[project.scripts]
spiceplot = "spiceplot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
